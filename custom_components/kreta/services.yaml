refresh:
  name: Refresh
  description: Refresh KRÉTA data now.
  fields:
    entry_id:
      name: Account
      description: Config entry ID. Optional when only one account exists.
      selector:
        text:
get_day:
  name: Get day
  description: Return one day from the local KRÉTA cache.
  fields:
    entry_id:
      name: Account
      selector:
        text:
    date:
      name: Date
      required: true
      selector:
        date:
get_week:
  name: Get week
  description: Return one week from the local KRÉTA cache.
  fields:
    entry_id:
      name: Account
      selector:
        text:
    date:
      name: Date
      required: true
      selector:
        date:
get_grades:
  name: Get grades
  description: Return bounded normalized grades from the local KRÉTA cache.
  fields:
    entry_id:
      name: Account
      selector:
        text:
    limit:
      name: Limit
      default: 20
      selector:
        number:
          min: 1
          max: 200
    subject:
      name: Subject
      selector:
        text:
get_tests:
  name: Get tests
  description: Return bounded upcoming tests from the local KRÉTA cache.
  fields:
    entry_id:
      name: Account
      selector:
        text:
    limit:
      name: Limit
      default: 20
      selector:
        number:
          min: 1
          max: 200
    subject:
      name: Subject
      selector:
        text:
get_homework:
  name: Get homework
  description: Return bounded homework from the local KRÉTA cache.
  fields:
    entry_id:
      name: Account
      selector:
        text:
    limit:
      name: Limit
      default: 20
      selector:
        number:
          min: 1
          max: 200
    subject:
      name: Subject
      selector:
        text:
